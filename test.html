<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Test · Test Vault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Cpath d='M18 20h28v6H18zm0 11h20v6H18zm0 11h28v6H18z' fill='%23fbbf24'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-test">
  <header class="viewer-header">
    <div class="viewer-top">
      <a class="back-btn" href="index.html" aria-label="Back to test library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <div class="viewer-heading">
        <h1 id="testTitle">Loading test…</h1>
        <p id="testMeta"></p>
      </div>

      <div class="viewer-actions">
        <div class="timer-box" id="timerBox" role="timer" aria-live="off" hidden>
          <span class="timer-label" id="timerLabel">Time left</span>
          <span class="timer-value" id="timerValue">--:--</span>
        </div>
        <div class="solution-badge" id="solutionBadge" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5 8 14l8-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Solutions · timer off
        </div>
        <button class="btn btn-primary" id="finishBtn" type="button" hidden>Finish &amp; solutions</button>
        <a class="btn btn-ghost" id="solutionBtn" href="#" hidden>Solutions</a>
        <a class="btn btn-primary" id="takeBtn" href="#" hidden>Take test</a>
        <a class="icon-link" id="pdfLink" href="#" target="_blank" rel="noopener" aria-label="Open PDF in a new tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
      </div>
    </div>
    <div class="timer-track" id="timerTrack" hidden><span id="timerFill"></span></div>
  </header>

  <div class="time-up" id="timeUpBanner" hidden role="alert">
    <span class="time-up-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <span><strong>Time is up.</strong> You can still review the paper or open the solutions.</span>
    <button class="btn btn-small btn-ghost" id="timeUpSolutions" type="button">View solutions</button>
  </div>

  <main class="viewer-main">
    <div class="not-found" id="notFound" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle cx="22" cy="22" r="12" fill="none" stroke="currentColor" stroke-width="3"/><path d="m31 31 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <h2>Test not found</h2>
      <p>That link does not match a test in this library.</p>
      <a class="btn btn-primary" href="index.html">Back to library</a>
    </div>
    <iframe id="pdfFrame" class="pdf-frame" title="Test PDF" hidden></iframe>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="test.js"></script>
</body>
</html>
